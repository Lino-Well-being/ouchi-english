<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個別相談のお申し込み｜おうち英語キズナClub</title>
<meta name="description" content="おうち英語キズナClub 個別伴走講座の無料個別相談お申し込みフォーム。">
<link rel="canonical" href="https://ouchi-english.jp/soudan.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
:root{
  --coral:#e8795a;
  --green:#4a6741;
  --green-deep:#395232;
  --cream:#faf6ec;
  --cream-deep:#f3ead8;
  --white:#fffdf8;
  --ink:#3d3327;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  color:var(--ink);
  background:var(--cream);
  line-height:1.9;
}
.wrap{max-width:560px;margin:0 auto;padding:44px 20px 64px}
.card{background:var(--white);border-radius:20px;padding:34px 26px;box-shadow:0 6px 24px rgba(107,79,58,.10)}
h1{font-size:1.35rem;color:var(--green-deep);font-weight:900;text-align:center;line-height:1.6}
.lead{margin-top:12px;font-size:.92rem;text-align:center}
label{display:block;font-weight:700;margin:20px 0 6px;font-size:.95rem}
label small{font-weight:400;color:#8a7d6b}
input[type=text],input[type=email],select,textarea{
  width:100%;padding:13px;border:2px solid var(--cream-deep);border-radius:12px;
  font-size:1rem;font-family:inherit;background:#fff;
}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
.cf-turnstile{margin-top:18px;display:flex;justify-content:center}
button[type=submit]{
  display:block;width:100%;margin-top:18px;padding:16px;border:none;border-radius:999px;
  background:var(--coral);color:#fff;font-size:1.05rem;font-weight:900;font-family:inherit;
  cursor:pointer;transition:opacity .2s;
}
button[type=submit]:hover{opacity:.88}
button[type=submit]:disabled{background:#b9b3a8;cursor:default}
#status{margin-top:14px;text-align:center;font-size:.92rem;color:var(--green-deep);min-height:1.5em;font-weight:700}
.note{margin-top:16px;font-size:.8rem;color:#8a7d6b;text-align:center}
.back{display:block;margin-top:24px;text-align:center;font-size:.9rem}
.back a{color:var(--green);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🌱 無料個別相談（Zoom）のお申し込み</h1>
    <p class="lead">送信後、私（益田千穂）からZoomの日程候補をメールでお返しします。</p>
    <form id="soudan-form">
      <label for="s-name">お名前 <small>（ニックネームでもOK）</small></label>
      <input id="s-name" name="name" type="text" autocomplete="name">
      <label for="s-email">メールアドレス <small>（必須）</small></label>
      <input id="s-email" name="email" type="email" inputmode="email" autocomplete="email" required>
      <label for="s-age">お子さんの年齢 <small>（任意）</small></label>
      <input id="s-age" name="age" type="text" placeholder="例：4歳と小2">
      <label for="s-message">相談したいこと <small>（任意・ひとことでも）</small></label>
      <textarea id="s-message" name="message" placeholder="例：小1の子のおうち英語が止まっていて、再開のきっかけがほしいです"></textarea>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEQvkn6NMgyZk9ZQ"></div>
      <div aria-hidden="true" style="position:absolute;left:-10000px">
        <label for="s-website">Website</label>
        <input id="s-website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit">この内容で申し込む</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="note">いただいた内容は、個別相談のご連絡以外には使いません。</p>
  </div>
  <p class="back"><a href="/kouza.html">← 講座の紹介ページへ戻る</a></p>
</div>

<script>
(() => {
  const form = document.getElementById('soudan-form');
  const status = document.getElementById('status');
  const button = form.querySelector('button[type="submit"]');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = new FormData(form);
    const cfToken = data.get('cf-turnstile-response');
    if (!cfToken) {
      status.textContent = 'bot確認を完了してから、もう一度お試しください。';
      return;
    }
    button.disabled = true;
    button.textContent = '送信中…';
    status.textContent = '';
    try {
      const response = await fetch('https://soudan-form.chiho-m.workers.dev/api/soudan', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          name: data.get('name'),
          email: data.get('email'),
          age: data.get('age'),
          message: data.get('message'),
          website: data.get('website'),
          cfToken,
        }),
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      form.reset();
      status.textContent = 'お申し込みを受け付けました。1〜2日以内にメールでご連絡しますね。';
    } catch {
      status.textContent = '送信できませんでした。通信状態を確認し、bot確認をやり直してください。';
      if (window.turnstile) window.turnstile.reset();
    } finally {
      button.disabled = false;
      button.textContent = 'この内容で申し込む';
    }
  });
})();
</script>
</body>
</html>
