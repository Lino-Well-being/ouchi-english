<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>メール登録（Rondoテスト）</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
    label { display: block; margin-bottom: 6px; }
    input[type=email] { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; }
    button { padding: 10px 20px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Rondo 登録テスト</h1>
  <p>これは配信システムの動作確認用ページです。</p>
  <form id="rondo-subscribe">
    <label for="rondo-email">メールアドレス</label>
    <input
      id="rondo-email"
      name="email"
      type="email"
      inputmode="email"
      autocomplete="email"
      spellcheck="false"
      required
    >
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEPpqsjJIxr0eJFA"></div>
    <div aria-hidden="true" style="position:absolute;left:-10000px">
      <label for="rondo-website">Website</label>
      <input id="rondo-website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit">登録確認メールを受け取る</button>
    <p id="rondo-status" role="status" aria-live="polite"></p>
  </form>

  <script>
    (() => {
      const form = document.getElementById('rondo-subscribe');
      const status = document.getElementById('rondo-status');
      const button = form.querySelector('button[type="submit"]');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const cfToken = data.get('cf-turnstile-response');
        if (!cfToken) {
          status.textContent = 'bot確認を完了してから、もう一度お試しください。';
          return;
        }
        button.disabled = true;
        button.textContent = '送信中…';
        status.textContent = '';
        try {
          const response = await fetch('https://rondo.chiho-m.workers.dev/api/subscribe', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              email: data.get('email'),
              website: data.get('website'),
              cfToken,
              source: 'web',
            }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          form.reset();
          status.textContent = '確認メールを送りました。受信箱のリンクを開いて登録を完了してください。';
        } catch {
          status.textContent = '送信できませんでした。通信状態を確認し、bot確認をやり直してください。';
          if (window.turnstile) window.turnstile.reset();
        } finally {
          button.disabled = false;
          button.textContent = '登録確認メールを受け取る';
        }
      });
    })();
  </script>
</body>
</html>
